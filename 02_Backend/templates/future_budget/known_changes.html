{% extends "base.html" %}
{% block content %}
<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-3xl mx-auto">
    <div class="mb-8">
        <h1 class="text-2xl md:text-3xl text-slate-800 font-bold">Add Known Change</h1>
    </div>
    <div class="bg-white shadow-lg rounded-sm border border-slate-200 p-5">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form.as_p }}
            </div>
            <div class="mt-6">
                <button type="submit" class="btn bg-indigo-500 text-white">Save Change</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
